        greeting: 'Hello, Neptune! So many blue clouds! ☁',
        art: `<rect width="1000" height="600" fill="#648b9e"/>
          <circle cx="710" cy="104" r="33" fill="#b9d0e5"/><circle cx="720" cy="96" r="9" fill="#9fb8d7"/>
          <g fill="#d4e7fa"><circle cx="265" cy="104" r="3"/><circle cx="416" cy="162" r="3"/><circle cx="598" cy="78" r="3"/><circle cx="820" cy="191" r="3"/></g>
          <path d="M0 296q145-74 300 0t330 8 370-35v331H0" fill="#80b2be"/>
          <path d="M0 375q160-68 340 1t330-7 330 11v220H0" fill="#95c2c9"/>
          <path d="M0 470q170-94 365-10t345-13 290 10v143H0" fill="#afd5d6"/>
          <ellipse cx="495" cy="365" rx="153" ry="59" fill="#6395a4"/>
          <ellipse cx="495" cy="365" rx="110" ry="36" fill="#497c90"/>
          <path d="M358 366c-1-74 285-64 279 5-5 52-221 62-223 5-1-32 139-35 143-9 3 16-53 25-66 11" fill="none" stroke="#c5e2e1" stroke-width="9" stroke-linecap="round"/>
          <g fill="none" stroke="#c3e3ea" stroke-width="10" stroke-linecap="round" opacity=".8"><path d="M80 322q97-37 188-2M721 410q98-37 193-6M201 503q93-22 169 3M580 516q85-18 158-2"/></g>`
      }
    };
    let pilotFrame, pilotElapsed = 0, pilotPreviousTime = 0, pilotArrived = false;
    let pilotWidth = 0, pilotHeight = 0;
    const passingStars = Array.from({ length: 240 }, () => ({
      x: (random() - .5) * 1.8, y: (random() - .5) * 1.8,
      z: .12 + random() * 1.6, size: .9 + random() * 1.5
    }));
    function paintPilotStars(seconds, speed) {
      if (!pilotContext) return;
      pilotContext.clearRect(0, 0, pilotWidth, pilotHeight);
      const centreX = pilotWidth / 2, centreY = pilotHeight * .46;
      const spread = Math.max(pilotWidth, pilotHeight) * .48;
      passingStars.forEach(star => {
        star.z -= seconds * speed;
        if (star.z < .12) star.z += 1.6;
        const x = centreX + star.x * spread / star.z;
        const y = centreY + star.y * spread / star.z;
        const oldZ = star.z + (reducedMotion.matches ? 0 : speed * .16);
        const tailX = centreX + star.x * spread / oldZ;
        const tailY = centreY + star.y * spread / oldZ;
        pilotContext.globalAlpha = Math.min(.95, Math.max(0, (1.72 - star.z) * 2));
        pilotContext.strokeStyle = '#d2e4ff';
        pilotContext.lineWidth = Math.min(2.5, star.size / star.z);
        pilotContext.lineCap = 'round';
        pilotContext.beginPath(); pilotContext.moveTo(tailX, tailY); pilotContext.lineTo(x, y); pilotContext.stroke();
        pilotContext.fillStyle = '#fff0ce';
        pilotContext.beginPath(); pilotContext.arc(x, y, Math.min(2.3, star.size / star.z), 0, Math.PI * 2); pilotContext.fill();
      });
      pilotContext.globalAlpha = 1;
    }
    function resizePilotView() {
      if (!cockpit.open) return;
      pilotWidth = windscreen.clientWidth; pilotHeight = windscreen.clientHeight;
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      pilotCanvas.width = Math.round(pilotWidth * ratio);
      pilotCanvas.height = Math.round(pilotHeight * ratio);
      if (pilotContext) pilotContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      paintPilotStars(0, 0);
    }
    function parkRocket() {
      const bounds = universe.getBoundingClientRect();
      const target = selectedPlanet.getBoundingClientRect();
      draw(target.left + target.width / 2 - bounds.left, target.top + target.height * .06 - bounds.top, 18);
      greeting.textContent = 'Hello, ' + selectedPlanet.dataset.planet + '! ✦';
    }
    function pilotTick(now) {
      if (!cockpit.open) return;
      const seconds = document.hidden ? 0 : Math.min(.05, Math.max(0, (now - pilotPreviousTime) / 1000));
      pilotPreviousTime = now;
      if (pilotArrived) {
        if (outwardView) {
          paintPilotStars(seconds, 0);
          paintShootingStars(seconds);
        }
        pilotFrame = requestAnimationFrame(pilotTick);
        return;
      }
      if (!document.hidden) pilotElapsed += seconds;
      const progress = Math.min(1, pilotElapsed / (reducedMotion.matches ? 3 : 8));
      // Stars spread away from the destination, creating a forward view with no camera shake.
      const acceleration = Math.min(1, .45 + progress * 5);
      const braking = Math.min(1, (1 - progress) * 5);
      const speed = reducedMotion.matches || document.hidden ? 0 : .62 * acceleration * braking;
      paintPilotStars(seconds, speed);
      const scale = reducedMotion.matches ? 1 : .14 + .86 * Math.pow(progress, 1.6);
      destination.style.transform = `translate(-50%, -50%) scale(${scale})`;
      document.getElementById('journey-progress').style.width = progress * 100 + '%';
      if (progress < 1) pilotFrame = requestAnimationFrame(pilotTick);
      else {
        pilotArrived = true;
        currentPlanet = selectedPlanet;
        stopEngine();
        pilotStatus.textContent = landingScenes[selectedPlanet.dataset.planet].greeting + ' Touch the planet to look into space.';
        windscreen.classList.add('landed');
        surface.setAttribute('aria-hidden', 'false');
        surface.disabled = false;
        replayButton.hidden = false;
        viewToggle.hidden = false;
        viewToggle.textContent = 'Look into space ↑';
        viewToggle.setAttribute('aria-label', 'Look into space from ' + currentPlanet.dataset.planet);
        document.getElementById('route-label').textContent = 'EXPLORING FROM';
        prepareSpaceView();
        parkRocket();
        chime([392, 494, 587, 784]);
        pilotFrame = requestAnimationFrame(pilotTick);
      }
    }
    function startPilotJourney() {
      cancelAnimationFrame(pilotFrame);
      cancelAnimationFrame(flightFrame); flightId++;
      journeyOrigin = currentPlanet;
      pilotElapsed = 0; pilotArrived = false; outwardView = false;
      replayButton.hidden = true;
      viewToggle.hidden = true;
      spaceView.hidden = true;
      // Keep keyboard focus on a visible control when a sky planet starts a flight.
      if (skyPlanets.contains(document.activeElement)) document.getElementById('leave-cockpit').focus({ preventScroll: true });
      windscreen.classList.remove('landed', 'outward');
      surface.setAttribute('aria-hidden', 'true');
      surface.disabled = true;
      const name = selectedPlanet.dataset.planet;
      const scene = landingScenes[name];
      surface.setAttribute('aria-label', scene.description + ' Touch to look into space from ' + name + '.');
      surface.dataset.planet = name;
      surface.innerHTML = '<svg viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">' + scene.art + '</svg>';
      document.querySelectorAll('.destination-choice').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.planet === name));
      });
      document.getElementById('destination-name').textContent = name;
      document.getElementById('route-label').textContent = journeyOrigin ? 'FROM ' + journeyOrigin.dataset.planet.toUpperCase() : 'OUR DESTINATION';
      pilotStatus.textContent = journeyOrigin ? 'From ' + journeyOrigin.dataset.planet + ' to ' + name + '! Off we go!' : 'Off to ' + name + '! You’re the pilot!';
      // Reuse each friendly planet, giving its SVG definitions distinct IDs.
      const planetPicture = copyPlanetPicture(selectedPlanet, 'pilot-');
      destination.replaceChildren(planetPicture);
      destination.style.transform = `translate(-50%, -50%) scale(${reducedMotion.matches ? 1 : .14})`;
      document.getElementById('journey-progress').style.width = '0%';
      resizePilotView();
      const departurePlanet = selectedPlanet;
      activateAudio().then(() => {
        if (cockpit.open && !pilotArrived && selectedPlanet === departurePlanet) chime([262, 330, 392]);
      });
      pilotPreviousTime = performance.now();
      pilotFrame = requestAnimationFrame(pilotTick);
    }
    function copyPlanetPicture(planet, prefix) {
      const planetPicture = planet.querySelector('svg').cloneNode(true);
      planetPicture.querySelectorAll('[id]').forEach(node => {
        const oldId = node.id, newId = prefix + oldId;
        node.id = newId;
        planetPicture.querySelectorAll('*').forEach(element => {
          for (const attr of Array.from(element.attributes)) {
            if (attr.value.includes('url(#' + oldId + ')')) {
              element.setAttribute(attr.name, attr.value.replaceAll('url(#' + oldId + ')', 'url(#' + newId + ')'));
            }
          }
        });
      });
      return planetPicture;
    }
    function chooseDestination(planet) {
      // Repeated taps on the current destination shouldn't delay arrival.
      if (cockpit.open && selectedPlanet === planet) {
        if (pilotArrived) showPlanetView(true);
        return;
      }
      selectedPlanet = planet;
      if (!cockpit.open) {
        cockpit.showModal();
        if (pilotArrived && currentPlanet === planet) {
          resizePilotView();
          showPlanetView(outwardView);
          pilotPreviousTime = performance.now();
          pilotFrame = requestAnimationFrame(pilotTick);
          return;
        }
      }
      startPilotJourney();
    }
    rocket.addEventListener('click', () => chooseDestination(selectedPlanet));
    document.getElementById('leave-cockpit').addEventListener('click', () => cockpit.close());
    document.getElementById('pilot-sound').addEventListener('click', () => soundButton.click());
    viewToggle.addEventListener('click', () => showPlanetView(!outwardView));
    surface.addEventListener('click', () => showPlanetView(true));
    replayButton.addEventListener('click', () => {
      document.getElementById('leave-cockpit').focus({ preventScroll: true });
      startPilotJourney();
    });
    cockpit.addEventListener('close', () => {
      cancelAnimationFrame(pilotFrame);
      stopEngine();
      if (pilotArrived) parkRocket();
      else fly(selectedPlanet);
      rocket.focus({ preventScroll: true });
    });
    new ResizeObserver(resizePilotView).observe(windscreen);
    document.querySelectorAll('.planet').forEach(planet => {
      planet.addEventListener('click', () => chooseDestination(planet));
      const choice = document.createElement('button');
      choice.className = 'destination-choice';
      choice.dataset.planet = planet.dataset.planet;
      choice.setAttribute('aria-label', 'Fly to ' + planet.dataset.planet);
      choice.setAttribute('aria-pressed', 'false');
      const label = document.createElement('span');
      label.textContent = planet.dataset.planet;
      choice.append(copyPlanetPicture(planet, 'choice-'), label);
      choice.addEventListener('click', () => chooseDestination(planet));
      document.getElementById('destinations').append(choice);
    });
    window.addEventListener('resize', () => {
      cancelAnimationFrame(flightFrame); flightId++;
      position = null; currentAngle = 18;
      rocket.style.left = ''; rocket.style.top = ''; rocket.style.transform = '';
      if (!cockpit.open) greeting.textContent = 'Tap a planet. Off we go!';
      else resizePilotView();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && audioContext) { stopEngine(); audioContext.suspend().catch(() => {}); }
      else if (soundOn && audioContext) activateAudio();
    });
  </script>
</body>
</html>
